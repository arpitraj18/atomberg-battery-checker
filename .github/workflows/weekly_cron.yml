name: Weekly Battery Maintenance

on:
  schedule:
    - cron: '0 10 * * 1' # Runs every Monday at 10:00 AM UTC
  workflow_dispatch:
    inputs:
      simulation_mode:
        description: 'Enable Simulation Mode?'
        required: true
        default: true
        type: boolean

jobs:
  battery-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Script
        env:
          # Auto-enable Simulation for scheduled runs; respect input for manual runs
          SIMULATION_MODE: ${{ github.event_name == 'schedule' && 'true' || inputs.simulation_mode }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: python main.py

      - name: Upload Excel Report
        uses: actions/upload-artifact@v4
        with:
          name: battery-check-report
          path: ./*.xlsx
          retention-days: 5